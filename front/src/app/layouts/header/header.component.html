<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" [routerLink]="['/private/dashboard']">
      <i class="bi bi-hospital"></i> Gestion RV Médicaux
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item" *ngFor="let item of navItems()">
          <a
            class="nav-link"
            [routerLink]="item.link"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          >
            <i [class]="item.icon"></i> {{ item.label }}
          </a>
        </li>
      </ul>

      <div class="d-flex" *ngIf="user() as u">
        <div class="dropdown">
          <button
            class="btn btn-outline-light dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="bi bi-person-circle"></i> {{ userLabel() }}
          </button>

          <ul class="dropdown-menu dropdown-menu-end">
            <li *ngIf="role() === 'patient'">
              <a class="dropdown-item" [routerLink]="['/private/mes-informations']">
                <i class="bi bi-person-vcard"></i> Mes informations
              </a>
            </li>

            <li>
              <a class="dropdown-item" [routerLink]="['/private/settings']">
                <i class="bi bi-gear"></i> Paramètres
              </a>
            </li>

            <li><hr class="dropdown-divider" /></li>

            <li>
              <button class="dropdown-item" type="button" (click)="logout()">
                <i class="bi bi-box-arrow-right"></i> Déconnexion
              </button>
            </li>
          </ul>
        </div>
      </div>

    </div>
  </div>
</nav>
