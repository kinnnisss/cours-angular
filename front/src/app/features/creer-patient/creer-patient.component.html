 <div class="container-fluid py-4">
        <div class="row">
            <div class="col-md-8">
                <h1 class="mb-4"><i class="bi bi-person-plus"></i> Créer un Nouveau Patient</h1>
                
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form id="patientForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="numero" class="form-label"><i class="bi bi-hash"></i> Numéro Patient</label>
                                    <input type="text" class="form-control" id="numero" placeholder="PAT-001" required>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="nom" class="form-label"><i class="bi bi-person"></i> Nom</label>
                                    <input type="text" class="form-control" id="nom" placeholder="Dupont" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="prenom" class="form-label"><i class="bi bi-person"></i> Prénom</label>
                                    <input type="text" class="form-control" id="prenom" placeholder="Jean" required>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="tel" class="form-label"><i class="bi bi-telephone"></i> Téléphone</label>
                                    <input type="tel" class="form-control" id="tel" placeholder="+221 77 123 45 67" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="adresse" class="form-label"><i class="bi bi-geo-alt"></i> Adresse</label>
                                <textarea class="form-control" id="adresse" rows="2" placeholder="Rue, Code postal, Ville" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="antecedents" class="form-label"><i class="bi bi-file-text"></i> Antécédents Médicaux</label>
                                <textarea class="form-control" id="antecedents" rows="4" placeholder="Décrivez vos antécédents médicaux, allergies, maladies chroniques..."></textarea>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="dashboard.html" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Annuler</a>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Créer Patient</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card border-0 shadow-sm bg-light">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-info-circle"></i> Informations</h5>
                        <p class="card-text small text-muted">
                            Veuillez remplir tous les champs avec les informations correctes du patient. 
                        </p>
                        <hr>
                        <h6 class="card-subtitle mb-2">Champs requis:</h6>
                        <ul class="list-unstyled small">
                            <li><i class="bi bi-check-circle text-success"></i> Numéro Patient</li>
                            <li><i class="bi bi-check-circle text-success"></i> Nom</li>
                            <li><i class="bi bi-check-circle text-success"></i> Prénom</li>
                            <li><i class="bi bi-check-circle text-success"></i> Téléphone</li>
                            <li><i class="bi bi-check-circle text-success"></i> Adresse</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
