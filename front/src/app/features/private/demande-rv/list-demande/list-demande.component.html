<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-list-check"></i> Mes Demandes de RV</h1>
    <a [routerLink]="['/private/demandes-rv/new']" class="btn btn-primary">
      <i class="bi bi-plus-circle"></i> Nouvelle Demande
    </a>
  </div>

  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Filtrer par statut</label>
          <select class="form-select"
                  [(ngModel)]="filterStatus"
                  (ngModelChange)="onFilterChange()">
            <option value="">Tous les statuts</option>
            <option value="en_attente">En attente</option>
            <option value="accepte">Acceptée</option>
            <option value="refuse">Refusée</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Filtrer par spécialité</label>
          <select class="form-select"
                  [(ngModel)]="filterSpecialite"
                  (ngModelChange)="onFilterChange()">
            <option value="">Toutes les spécialités</option>
            <option *ngFor="let sp of specialites" [value]="sp">{{ sp }}</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th><i class="bi bi-person"></i> Patient</th>
            <th><i class="bi bi-stethoscope"></i> Spécialité</th>
            <th><i class="bi bi-calendar"></i> Date Demandée</th>
            <th><i class="bi bi-clock"></i> Heure</th>
            <th><i class="bi bi-info-circle"></i> Statut</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let d of pagedDemandes">
            <td>
              <div class="d-flex align-items-center">
                <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
                     style="width: 40px; height: 40px;">
                  <i class="bi bi-person"></i>
                </div>
                <div class="ms-2">
                  <strong>{{ d.patientNom }}</strong><br />
                  <small class="text-muted">{{ d.patientId }}</small>
                </div>
              </div>
            </td>

            <td>{{ d.specialite }}</td>
            <td>{{ d.date }}</td>
            <td>{{ d.heure }}</td>
            <td>
              <span class="badge" [class]="badgeClass(d.status)">
                <i [class]="badgeIcon(d.status)"></i> {{ badgeLabel(d.status) }}
              </span>
            </td>
          </tr>

          <tr *ngIf="pagedDemandes.length === 0">
            <td colspan="5" class="text-center text-muted py-4">
              Aucune demande trouvée pour ces filtres.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

    <app-pagination
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChange)="goToPage($event)">
    </app-pagination>

</div>
