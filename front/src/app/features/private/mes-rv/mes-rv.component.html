<div class="container-fluid py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="m-0">
      <i class="bi bi-calendar-check"></i> Mes Rendez-vous
    </h1>

    <!-- <a class="btn btn-primary" [routerLink]="['/demande-rv']">
      <i class="bi bi-plus-circle"></i> Nouveau RV
    </a> -->
  </div>

  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3 align-items-end">

        <div class="col-md-4">
          <label class="form-label">Filtrer par état</label>
        <select class="form-select"
                [ngModel]="''"
                (ngModelChange)="onStatusChange($event)">
          <option value="">Tous les états</option>
          <option value="confirme">Confirmé</option>
          <option value="realise">Réalisé</option>
          <option value="en_attente">En attente</option>
          <option value="annule">Annulé</option>
        </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Filtrer par mois</label>
          <select class="form-select"
                  [ngModel]="''"
                  (ngModelChange)="onMonthChange($event)">
            <option value="">Tous les mois</option>
            <option *ngFor="let m of ((months$ | async) ?? [])" [value]="m.value">
              {{ m.label }}
            </option>
          </select>
        </div>

        <!-- <div class="col-md-4">
          <label class="form-label">Filtrer par médecin</label>
          <input type="text"
                 class="form-control"
                 placeholder="Nom du médecin..."
                 [(ngModel)]="filterMedecin"
                 (ngModelChange)="onFilterChange()">
        </div> -->

      </div>
    </div>
  </div>

<div class="row g-4">
  <div class="col-lg-4 col-md-6" *ngFor="let rv of ((filteredRdvs$ | async) ?? [])">
    <app-rdv-card
      [rv]="rv"
      [detailsLinkBase]="'/private/mes-rv'"
      (cancel)="cancelRv($event)"
      (report)="downloadReport($event)">
    </app-rdv-card>
  </div>

  <div class="col-12" *ngIf="(((filteredRdvs$ | async) ?? []).length === 0)">
    <div class="alert alert-light border text-center py-4">
      <i class="bi bi-info-circle"></i> Aucun rendez-vous trouvé avec ces filtres.
    </div>
  </div>
</div>
</div>
