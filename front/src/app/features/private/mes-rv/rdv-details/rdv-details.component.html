<div class="container-fluid py-4" *ngIf="(rdv$ | async) as rv; else notFound">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="m-0"><i class="bi bi-calendar2-event"></i> Détails du rendez-vous</h1>

    <a class="btn btn-outline-secondary" [routerLink]="['/private/mes-rv']">
      <i class="bi bi-arrow-left"></i> Retour
    </a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">

      <div class="d-flex justify-content-between align-items-start">
        <div>
          <div class="text-muted">ID : <strong>{{ rv.id }}</strong></div>
          <div class="mt-2">
            <app-status-badge [status]="rv.status"></app-status-badge>
          </div>
        </div>

        <div class="d-flex gap-2">
          <a class="btn btn-outline-primary" [routerLink]="['/private/mes-rv', rv.id, 'consultation']">
            <i class="bi bi-clipboard2-pulse"></i> Voir consultation
          </a>
          <a class="btn btn-primary" [routerLink]="['/private/mes-rv', rv.id, 'ordonnance']">
            <i class="bi bi-file-earmark-medical"></i> Voir ordonnance
          </a>
        </div>
      </div>

      <hr />

      <app-key-value [items]="kvItems(rv)"></app-key-value>

      <div class="mt-3" *ngIf="rv.notes">
        <h6 class="mb-2"><i class="bi bi-journal-text"></i> Notes</h6>
        <div class="p-3 rounded border bg-light">{{ rv.notes }}</div>
      </div>

    </div>
  </div>
</div>

<ng-template #notFound>
  <div class="container-fluid py-4">
    <div class="alert alert-warning border">
      <i class="bi bi-info-circle"></i> Rendez-vous introuvable.
    </div>
  </div>
</ng-template>
