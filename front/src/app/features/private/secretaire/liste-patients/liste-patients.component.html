<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="m-0">
      <i class="bi bi-people"></i> Patients
    </h1>

    <a class="btn btn-primary" [routerLink]="['/private/secretaire/creer-patient']">
      <i class="bi bi-plus-circle"></i> Nouveau patient
    </a>
  </div>

  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body d-flex flex-column flex-md-row gap-3 align-items-md-center">
      <div class="flex-grow-1">
        <label class="form-label mb-1">Recherche</label>
        <input
          class="form-control"
          placeholder="Numero, nom, prenom, telephone..."
          (input)="onSearchChange($any($event.target).value)">
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary" type="button" (click)="setSort('nom')">
          <i [class]="sortIcon('nom')"></i> Nom
        </button>
        <button class="btn btn-outline-secondary" type="button" (click)="setSort('numero')">
          <i [class]="sortIcon('numero')"></i> Numero
        </button>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Numero</th>
            <th>Nom</th>
            <th>Prenom</th>
            <th>Telephone</th>
            <th>Adresse</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>

        <tbody *ngIf="pageData$ | async as pageData">
          <tr *ngFor="let p of pageData.items; trackBy: trackById">
            <td class="fw-semibold">{{ p.numero }}</td>
            <td>{{ p.nom }}</td>
            <td>{{ p.prenom }}</td>
            <td>{{ p.tel }}</td>
            <td class="text-muted text-truncate" style="max-width: 240px;">
              {{ p.adresse }}
            </td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-primary"
                [routerLink]="['/private/secretaire/patients', p.id]">
                <i class="bi bi-eye"></i> Voir
              </a>
            </td>
          </tr>

          <tr *ngIf="pageData.items.length === 0">
            <td colspan="6" class="text-center py-4 text-muted">
              <i class="bi bi-info-circle"></i> Aucun patient trouve.
            </td>
          </tr>
        </tbody>
      </table>

      <div class="d-flex justify-content-center py-3">
        <app-pagination
          [currentPage]="(currentPage$ | async) ?? 1"
          [totalPages]="(pageData$ | async)?.totalPages ?? 1"
          (pageChange)="goToPage($event)">
        </app-pagination>
      </div>
    </div>
  </div>
</div>
