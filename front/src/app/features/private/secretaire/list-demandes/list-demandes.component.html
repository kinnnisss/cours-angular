<div class="container-fluid py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <h1 class="h3 m-0 d-flex align-items-center gap-2">
      <span class="icon-circle"><i class="bi bi-clipboard-check"></i></span>
      Demandes de rendez-vous (Secrétaire)
    </h1>

    <button class="btn btn-outline-secondary" (click)="reload()">
      <i class="bi bi-arrow-clockwise"></i> Rafraîchir
    </button>
  </div>

  <div class="card border-0 shadow-sm mb-4 card-soft">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Statut</label>
          <select class="form-select" [ngModel]="''" (ngModelChange)="onStatusChange($event)">
            <option value="">Tous</option>
            <option value="en_attente">En attente</option>
            <option value="accepte">Acceptée</option>
            <option value="refuse">Refusée</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Spécialité</label>
          <select class="form-select" [ngModel]="''" (ngModelChange)="onSpecialiteChange($event)">
            <option value="">Toutes</option>
            <option *ngFor="let sp of ((specialites$ | async) ?? [])" [value]="sp">{{ sp }}</option>
          </select>
        </div>

        <div class="col-md-5">
          <label class="form-label">Rechercher patient</label>
          <input
            type="text"
            class="form-control"
            placeholder="Nom du patient ou ID (ex: 1)..."
            [ngModel]="''"
            (ngModelChange)="onSearchPatientChange($event)"
          />
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm card-soft">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Patient</th>
            <th>Spécialité</th>
            <th>Date</th>
            <th>Heure</th>
            <th>Statut</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let d of ((pagedDemandes$ | async) ?? [])">
            <td>
              <div class="fw-semibold">{{ d.patientNom }}</div>
              <div class="text-muted small">ID: {{ d.patientId }}</div>
            </td>
            <td>{{ d.specialite }}</td>
            <td>{{ d.date }}</td>
            <td>{{ d.heure }}</td>

            <td>
              <span [class]="badgeClass(d.status)">
                <i [class]="badgeIcon(d.status)"></i>
                {{ badgeLabel(d.status) }}
              </span>
            </td>

            <td class="text-end actions">
              <app-voir
                [link]="['/private/demandes-rv', d.id]"
                title="Voir"
                variant="outline"
                size="sm">
              </app-voir>

              <!-- Accepter / Refuser -->
              <button class="btn btn-sm btn-outline-success ms-2"
                      (click)="accept(d)"
                      [disabled]="d.status !== 'en_attente'">
                <i class="bi bi-check2"></i>
              </button>

              <button class="btn btn-sm btn-outline-danger ms-2"
                      (click)="refuse(d)"
                      [disabled]="d.status !== 'en_attente'">
                <i class="bi bi-x-lg"></i>
              </button>
            </td>
          </tr>

          <tr *ngIf="(((pagedDemandes$ | async) ?? []).length === 0)">
            <td colspan="6" class="text-center text-muted py-4">
              <i class="bi bi-info-circle"></i> Aucune demande trouvée.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <app-pagination
    class="mt-3"
    [currentPage]="(currentPage$ | async) ?? 1"
    [totalPages]="(totalPages$ | async) ?? 1"
    (pageChange)="goToPage($event)">
  </app-pagination>
</div>
